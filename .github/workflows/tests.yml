name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # The tests use mocks of the COMSOL Java API. COMSOL is not installed here.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the server and test dependencies
        # Install the package without its optional search stack (chromadb,
        # sentence-transformers, pymupdf). The tests do not import it.
        run: |
          python -m pip install --upgrade pip
          pip install "mcp>=1.0.0,<2" "mph>=1.3.0" "pydantic>=2.0.0" pytest
      - name: Run tests
        run: python -m pytest -q
